# pnpm 12 blocks dependency install scripts by default; only these are allowed/denied explicitly.
allowBuilds:
  esbuild: true
  # Ships prebuilt bindings via optionalDependencies; its postinstall is only a fallback.
  unrs-resolver: false
  # Local Cloudflare runtime (the CMS on staging) downloads its binary on install.
  workerd: true

# Our own packages (ui-library, tokens) are consumed right after we publish them; the release-age
# delay only protects against compromised third-party releases.
minimumReleaseAgeExclude:
  - '@inzumer/*'
  - '@cloudflare/workerd-darwin-64@1.20260930.2'
  - '@cloudflare/workerd-darwin-arm64@1.20260930.2'
  - '@cloudflare/workerd-linux-64@1.20260930.2'
  - '@cloudflare/workerd-linux-arm64@1.20260930.2'
  - '@cloudflare/workerd-windows-64@1.20260930.2'
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
  - wrangler@4.145.0

# Also install the WebAssembly builds of native packages (napi-rs). Their loaders fall back to WASM
# automatically when a native binary can't be loaded — e.g. Windows Smart App Control blocking a
# freshly released, not-yet-reputable `.node` file. Native binaries are still preferred when they load.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - wasm32

# Advisories fixed by a local patch (no upstream release yet); `pnpm audit` can't see patches.
# Drop the patch and the entry once a fixed version ships.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics (via astro): max-stale no longer serves responses zeroed for security.
    - GHSA-ch52-4w7c-c8xp

patchedDependencies:
  http-cache-semantics@4.2.0: patches/http-cache-semantics@4.2.0.patch

# Patched versions of vulnerable transitive dependencies (pnpm audit).
overrides:
  'sharp@<0.35.5': '^0.35.5'
  'source-map-js@<1.2.2': '^1.2.2'
